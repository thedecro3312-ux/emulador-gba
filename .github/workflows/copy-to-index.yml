name: Copy to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy files to their final locations
        run: |
          cp emulador-gba-publico.html index.html
          mkdir -p assets/ejs/compression
          cp extract7z.js extractzip.js libunrar.js libunrar.wasm assets/ejs/compression/
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html assets/ejs/compression/
          git commit -m "Update index.html and add assets/ejs/compression" || echo "No changes to commit"
          git push
