name: copy-to-index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp emulador-gba-publico-new.html index.html
          rm emulador-gba-publico-new.html
          git config user.name "thedecro3312-ux"
          git config user.email "thedecro3312@gmail.com"
          git add -A
          git commit -m "Publish emulator Dual keyboard fix" || echo "nothing to commit"
          git push
