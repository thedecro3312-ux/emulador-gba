name: Publish updated public GBA emulator page

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-to-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy public page to index.html
        run: |
          cp emulador-gba-publico.html index.html
          rm emulador-gba-publico.html
      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html emulador-gba-publico.html
          git commit -m "Publish updated public GBA emulator page"
          git push
