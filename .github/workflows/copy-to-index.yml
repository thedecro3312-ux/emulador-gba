name: Copy corrected page to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy-to-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy corrected file to index.html and remove uploaded file
        run: |
          cp emulador-gba-publico.html index.html
          rm emulador-gba-publico.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -u emulador-gba-publico.html
          git diff --cached --quiet || git commit -m "Replace index.html with corrected emulator page"
          git push
