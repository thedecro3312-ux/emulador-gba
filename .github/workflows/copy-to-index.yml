name: Copy public file to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy public file to index.html
        run: |
          cp emulador-gba-publico.html index.html
          rm emulador-gba-publico.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -u emulador-gba-publico.html
          git commit -m "Publish updated public GBA emulator page" || echo "No changes to commit"
          git push
